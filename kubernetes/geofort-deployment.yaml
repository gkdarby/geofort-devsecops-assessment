apiVersion: apps/v1
kind: Deployment
metadata:
  name: geofortapplication
  namespace: geofort-app
  labels:
    app: geofortapplication
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geofortapplication
  template:
    metadata:
      labels:
        app: geofortapplication
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: geofortapplication
          image: 588738572310.dkr.ecr.us-east-1.amazonaws.com/geofort-repo:V24
          ports:
            - containerPort: 8080
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
